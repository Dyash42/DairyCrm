name: jharanai_mobile
description: Jharanai Sales Executive (milkman) app — QR-scan deliveries, offline-first.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Offline-first
  drift: ^2.18.0           # SQLite ORM
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3

  # QR
  mobile_scanner: ^5.0.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
